<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter Subscribe</title>

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

/* Background */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
}

/* Form Card */
#form-container{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding:40px;
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
    width:100%;
    max-width:420px;
    text-align:center;
}

/* Title */
h2{
    color:white;
    margin-bottom:25px;
}

/* Form Layout */
form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

/* Input Fields */
input{
    padding:12px 14px;
    border-radius:8px;
    border:none;
    outline:none;
    font-size:15px;
    background:rgba(255,255,255,0.9);
    transition:0.3s;
}

/* Input Focus */
input:focus{
    box-shadow:0 0 10px rgba(0,0,0,0.25);
    transform:scale(1.02);
}

/* Button */
button{
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

/* Button Hover */
button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,0.3);
}

/* Button Disabled */
button:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

/* Thank You Message */
#thank-you-msg{
    display:none;
    font-size:18px;
    color:#0f5132;
    margin-top:20px;
    background:#d1e7dd;
    padding:12px;
    border-radius:8px;
}

</style>
</head>

<body>

<div id="form-container">

<h2>Subscribe to Newsletter</h2>

<form id="newsletter-form">
<input type="text" name="name" placeholder="Enter your name" required>
<input type="email" name="email" placeholder="Enter your email" required>
<button type="submit" id="submit-btn">Subscribe</button>
</form>

<div id="thank-you-msg">
✅ Thank you for subscribing!
</div>

</div>

<script>

const form = document.getElementById('newsletter-form');
const thankYouMsg = document.getElementById('thank-you-msg');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', function(e) {

    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.innerText = "Sending...";

    const scriptURL = 'https://script.google.com/macros/s/AKfycbxHlFGKQfG41nMuolsGyuUNOhLcmy9WSTksyG6_PsoQc1dDeVe4vVn2q9xmz0GMpsJsOQ/exec';

    fetch(scriptURL, {
        method: 'POST',
        body: new FormData(form)
    })
    .then(response => {

        form.style.display = 'none';
        thankYouMsg.style.display = 'block';

    })
    .catch(error => {

        console.error('Error!', error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "Try Again";

    });

});

</script>

</body>
</html>
